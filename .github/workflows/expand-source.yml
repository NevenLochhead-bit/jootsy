name: Expand source bundle
on:
  push:
    branches: [main]
    paths: [source.tar.gz, .github/workflows/expand-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-expansion
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed local source
        run: tar -xzf source.tar.gz --exclude="._*"
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Expand Jootsy source bundle"
            git push
          fi

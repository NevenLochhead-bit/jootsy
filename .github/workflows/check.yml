name: Transaction checks
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Expand source bundle]
    types: [completed]
  push:
    branches: [main, engineer-b]
    paths: ["netlify/**", "public/**", "scripts/**", "package.json", ".github/workflows/check.yml"]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jootsy_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: jootsy_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NETLIFY_DB_URL: postgres://jootsy_test:disposable_ci_only@localhost:5432/jootsy_test
      CI_TEST_DATABASE: "true"
      INSTRUCTOR_PASSCODE: disposable_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check
      - run: node scripts/api-checks.mjs
      - run: npm run build
      - run: if [ -f scripts/map-checks.mjs ]; then node scripts/map-checks.mjs; fi
